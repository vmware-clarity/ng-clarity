name: Animation Recordings
# Records the animations of the components (tests/animations) for two versions of the library and compares them.
# On pull requests, it compares the pull request (merged into its base branch) with the base branch, and the
# "PR Animation Recordings Bot" workflow comments on the pull request when animations differ.
# It can also be run from the Actions tab to compare any two git refs.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Git ref recorded as the baseline (branch, tag or SHA)
        required: true
        default: main
      head:
        description: Git ref compared with the baseline (branch, tag or SHA)
        required: true
concurrency:
  group: animation-recordings-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  record:
    name: Record Animations
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        side: ['base', 'head']
    env:
      CLARITY_ANIMATIONS_LABEL: ${{ matrix.side }}
    steps:
      - name: Checkout Recorder
        uses: actions/checkout@v4
        with:
          path: recorder
      # On pull requests, `head` is the merge commit: the comparison shows the changes of the pull request only.
      - name: Checkout ${{ matrix.side }}
        uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.side == 'base' && (inputs.base || github.event.pull_request.base.sha) || (inputs.head || github.sha) }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'recorder/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            recorder/package-lock.json
            app/package-lock.json
      - name: Cache Storybook Build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: app/dist/docs
          key: animation-recordings-storybook-${{ hashFiles('app/package-lock.json', 'app/angular.json', 'app/projects/angular/**', 'app/projects/addons/**', 'app/projects/ui/**', 'app/.storybook/**') }}
      - name: Build Storybook (${{ matrix.side }})
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm run _build:storybook
      - name: Install Recorder
        working-directory: recorder
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Record Animations
        working-directory: recorder
        env:
          CLARITY_STORYBOOK_DIR: ../app/dist/docs
        run: npm run animations:record
      - name: Upload Recording
        uses: actions/upload-artifact@v4
        with:
          name: animation-recording-${{ matrix.side }}
          path: recorder/dist/animation-recordings/${{ matrix.side }}/

  compare:
    name: Compare Animations
    needs: record
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Download Base Recording
        uses: actions/download-artifact@v4
        with:
          name: animation-recording-base
          path: dist/animation-recordings/base
      - name: Download Head Recording
        uses: actions/download-artifact@v4
        with:
          name: animation-recording-head
          path: dist/animation-recordings/head
      - name: Compare
        run: |
          node ./scripts/compare-animation-recordings.js base head
          cat dist/animation-recordings/base-vs-head.md >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the `animation-report` artifact and open `base-vs-head.html` to watch the animations.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: animation-report
          path: dist/animation-recordings/
      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: animation-summary
          path: |
            dist/animation-recordings/base-vs-head.md
            dist/animation-recordings/base-vs-head.json
