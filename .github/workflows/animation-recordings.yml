name: Animation Recordings
# Records the animations of the components (tests/animations) for two versions of the library and compares them.
# Run it from the Actions tab, or add the `animation-recordings` label to a pull request to compare it with its base.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Git ref recorded as the baseline (branch, tag or SHA)
        required: true
        default: main
      head:
        description: Git ref compared with the baseline (branch, tag or SHA)
        required: true
  pull_request:
    types: [labeled, synchronize, reopened]
concurrency:
  group: animation-recordings-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  record:
    name: Record Animations (${{ matrix.side }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'animation-recordings')
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        side: ['base', 'head']
    env:
      CLARITY_ANIMATIONS_LABEL: ${{ matrix.side }}
    steps:
      - name: Checkout Recorder
        uses: actions/checkout@v4
        with:
          path: recorder
      - name: Checkout ${{ matrix.side }}
        uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.side == 'base' && (inputs.base || github.event.pull_request.base.sha) || (inputs.head || github.event.pull_request.head.sha) }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'recorder/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            recorder/package-lock.json
            app/package-lock.json
      - name: Build Storybook (${{ matrix.side }})
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm run _build:storybook
      - name: Install Recorder
        working-directory: recorder
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Record Animations
        working-directory: recorder
        env:
          CLARITY_STORYBOOK_DIR: ../app/dist/docs
        run: npm run animations:record
      - name: Upload Recording
        uses: actions/upload-artifact@v4
        with:
          name: animation-recording-${{ matrix.side }}
          path: recorder/dist/animation-recordings/${{ matrix.side }}/

  compare:
    name: Compare Animations
    needs: record
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Download Base Recording
        uses: actions/download-artifact@v4
        with:
          name: animation-recording-base
          path: dist/animation-recordings/base
      - name: Download Head Recording
        uses: actions/download-artifact@v4
        with:
          name: animation-recording-head
          path: dist/animation-recordings/head
      - name: Compare
        run: |
          node ./scripts/compare-animation-recordings.js base head | tee comparison.txt
          {
            echo '## Animation recordings: base vs head'
            echo 'Download the `animation-report` artifact and open `base-vs-head.html` to watch and compare the animations.'
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: animation-report
          path: dist/animation-recordings/
