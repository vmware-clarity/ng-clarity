name: Flake Repro (website datagrid custom-filtering)
# TEMPORARY: reproduces the flaky website/datagrid/code-custom-filtering snapshot in the same environment as the
# PR Website Visual Regression Test job, with tests/website/flake-probe.ts recording the column measurements.
on:
  push:
    branches: ['flake/website-datagrid-custom-filtering-repro', 'flake/website-datagrid-custom-filtering-repro-ng22']
  workflow_dispatch:
concurrency:
  group: flake-repro-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-website:
    name: Build Website
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run _build:website
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/website/
          retention-days: 3

  # Deterministic repro: FLAKE_FORCE=1 makes every declaration of the weight-500 Metropolis face load slowly, so the
  # datagrids measure their columns while the badge font is still loading. Control runners use FLAKE_FORCE=0. Both
  # run the datagrid page with --update-snapshots (no probe) and record which snapshots changed and their blob hashes.
  forced:
    name: Forced ${{ matrix.force }} rep ${{ matrix.rep }}
    needs: build-website
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        force: ['1', '0']
        rep: [1, 2, 3]
    env:
      CLARITY_VRT_BROWSER: chromium
      CLARITY_VRT_THEME: dark
      CLARITY_VRT_DENSITY: compact
      CLARITY_VRT_SUITE: website
      FLAKE_FORCE: ${{ matrix.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist/website/
      - name: Run the datagrid page twice
        run: |
          mkdir -p flake-out
          for i in 1 2; do
            npx playwright test -g "chromium/website/datagrid$" --update-snapshots --reporter dot > flake-out/run-$i.log 2>&1 || true
            changed=$(git status --porcelain -- tests/snapshots | grep '\.png | awk '{print $2}')
            echo "force ${{ matrix.force }} rep ${{ matrix.rep }} iteration $i changed: ${changed:-none}" | tee -a flake-out/summary.txt
            for f in $changed; do
              echo "  $(git hash-object "$f") $f" | tee -a flake-out/summary.txt
              cp "$f" "flake-out/iter$i-$(echo "$f" | tr '/' '_')"
            done
            git checkout -- tests/snapshots
            git clean -fdq -- tests/snapshots
          done
          cat flake-out/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: forced-${{ matrix.force }}-${{ matrix.rep }}-run${{ github.run_attempt }}
          path: flake-out/
          retention-days: 7
