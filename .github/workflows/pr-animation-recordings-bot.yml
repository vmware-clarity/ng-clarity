name: PR Animation Recordings Bot
# Comments the result of the "Animation Recordings" workflow on the pull request: which scenarios animate differently
# from the base branch, with a link to the report. It only comments when animations differ (or to update a previous
# comment), and never runs code from the pull request.
on:
  workflow_run:
    workflows: [Animation Recordings]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  pr-animation-recordings-bot:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Event
        id: get-pr-event
        uses: potiuk/get-workflow-origin@v1_5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sourceRunId: ${{ github.event.workflow_run.id }}
      - name: Download Summary
        uses: actions/download-artifact@v4
        with:
          name: animation-summary
          path: ${{ runner.temp }}/animation-summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get-pr-event.outputs.pullRequestNumber }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SUMMARY_DIR: ${{ runner.temp }}/animation-summary
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- animation-recordings -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const run_id = Number(process.env.RUN_ID);
            if (!issue_number) {
              core.setFailed('No pull request found for the workflow run');
              return;
            }

            const counts = JSON.parse(fs.readFileSync(path.join(process.env.SUMMARY_DIR, 'base-vs-head.json'), 'utf8'));
            const differences = Number(counts.changed || 0) + Number(counts.differs || 0);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find(
              comment => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            if (!differences && !existing) {
              core.info('The animations match the base branch; nothing to comment.');
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id });
            const report = artifacts.data.artifacts.find(artifact => artifact.name === 'animation-report');
            const summary = fs.readFileSync(path.join(process.env.SUMMARY_DIR, 'base-vs-head.md'), 'utf8').slice(0, 60000);
            const links = report
              ? `[Download the report](${runUrl}/artifacts/${report.id}) (unzip it and open \`base-vs-head.html\`) · [workflow run](${runUrl})`
              : `[Workflow run](${runUrl})`;
            const body = [marker, summary, `${links} · recorded for ${process.env.HEAD_SHA.slice(0, 8)}`].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
