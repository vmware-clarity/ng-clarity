name: PR Build
on:
  pull_request:
concurrency:
  group: pr-build-${{github.event.pull_request.number}}
  cancel-in-progress: true
jobs:
  pr-build:
    name: PR Build (${{matrix.angular}})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ['Angular v21', 'Angular v22']
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Build Clarity Library (Angular v21)
        run: |
          npm run _build:angular
          npm run _build:addons
          npm run _build:ui
      - name: Prepare Consuming Infrastructure for Angular v22
        if: ${{matrix.angular == 'Angular v22'}}
        run: |
          node ./scripts/use-dist-paths.js
          npx ng update @angular/core@22 @angular/cli@22 @angular/cdk@22 --allow-dirty --force
          npm install --save-dev @angular-builders/custom-esbuild@22 --force
      - name: Lint
        if: ${{matrix.angular == 'Angular v21'}}
        run: npm run lint
      - name: Build Consuming Applications
        run: |
          npm run _build:demo
          npm run _build:website
          npm run _build:storybook
      - name: Test
        run: |
          if [ "${{matrix.angular}}" = "Angular v21" ]; then
            npm run test
          else
            npm run _test:schematics
          fi
        shell: bash
      - name: Public Api Check
        if: ${{matrix.angular == 'Angular v21'}}
        run: npm run public-api:check
      - name: Upload Docs Artifact
        if: ${{matrix.angular == 'Angular v21'}}
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist/docs/
      - name: Upload Website Artifact
        if: ${{matrix.angular == 'Angular v21'}}
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/website/
      - name: Upload Coverage Artifact
        if: ${{matrix.angular == 'Angular v21'}}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # Required status check: branch protection expects a single "PR Build" check.
  pr-build-status:
    name: PR Build
    if: ${{ always() }}
    needs: [pr-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check Angular matrix results
        run: |
          if [ "${{ needs.pr-build.result }}" != "success" ]; then
            echo "PR Build matrix result: ${{ needs.pr-build.result }}"
            exit 1
          fi

  pr-visual-regression-test:
    name: PR Visual Regression Test (${{matrix.browser}}, ${{matrix.theme}}, ${{matrix.density}}, shard ${{matrix.shard}}/2)
    timeout-minutes: 40
    # This job intentionally does not use the `ubuntu-latest` image.
    # An updated image could generate different snapshots, so we should explicitly update the image version.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: ['chromium', 'firefox']
        theme: ['light', 'dark']
        density: ['default', 'compact']
        shard: [1, 2]
    env:
      CLARITY_VRT_BROWSER: ${{matrix.browser}}
      CLARITY_VRT_THEME: ${{matrix.theme}}
      CLARITY_VRT_DENSITY: ${{matrix.density}}
      CLARITY_VRT_SHARD: ${{matrix.shard}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{matrix.browser}}
      - name: Cache Storybook Build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: dist/docs
          key: storybook-build-${{hashFiles('package-lock.json', 'projects/angular/**', 'projects/ui/**', '.storybook/**', 'angular.json')}}
      - name: Build Storybook
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        run: npm run _build:storybook
      - name: Update Visual Snapshots
        run: npx playwright test --update-snapshots --shard=${{matrix.shard}}/2
      - name: Collect Changes
        id: diff
        run: |
          git add .
          git diff --cached --binary > visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff
      - name: Upload Changes
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff
          path: visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff

  pr-animation-test:
    name: PR Animation Test
    timeout-minutes: 30
    permissions:
      contents: read
      # Posts the comment linking to the animation report.
      pull-requests: write
    # Same image as the visual regression tests: an updated image could render the frames differently.
    runs-on: ubuntu-24.04
    env:
      CLARITY_VRT_BROWSER: chromium
      CLARITY_VRT_SUITE: animations
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Unlike the visual regression tests' cache, the key includes the addons: a scenario animates an addons card.
      - name: Cache Storybook Build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: dist/docs
          key: animation-storybook-build-${{hashFiles('package-lock.json', 'projects/angular/**', 'projects/addons/**', 'projects/ui/**', '.storybook/**', 'angular.json')}}
      - name: Build Storybook
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        run: npm run _build:storybook
      # Compares the frames of the animations with tests/snapshots/chromium/animations: the report shows the frames
      # that changed.
      - name: Test Animations
        id: test
        continue-on-error: true
        run: npx playwright test --retries=0
      # Like the visual snapshots: the PR Visual Snapshot Update Bot offers the changed snapshots as a commit to
      # cherry-pick.
      - name: Update Animation Snapshots
        if: ${{ steps.test.outcome == 'failure' }}
        run: npx playwright test --update-snapshots --reporter=list
      - name: Collect Changes
        id: animation-changes
        run: |
          git add tests/snapshots
          git diff --cached --binary > visual-snapshot-changes-animations.diff
          if [ -s visual-snapshot-changes-animations.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Only when there are changes: the bot cannot apply an empty patch.
      - name: Upload Changes
        if: ${{ steps.animation-changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-animations.diff
          path: visual-snapshot-changes-animations.diff
      - name: Upload Animation Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: animation-report
          path: playwright-report/
      # Deployed like the Storybook preview. Pull requests from forks have no access to the Netlify token or to
      # comments: their report is only in the animation-report artifact.
      - name: Deploy Animation Report
        id: deploy-report
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('playwright-report/index.html') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          NETLIFY_AUTH_TOKEN: ${{secrets.NETLIFY_AUTH_TOKEN}}
        run: npx netlify-cli@23.6.0 deploy --no-build --dir playwright-report --site ${{secrets.NETLIFY_SITE_NAME}} --alias ${{github.event.pull_request.number}}-animations
      - name: Find Animation Report Comment
        id: find-comment
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.test.outcome != 'skipped' }}
        uses: peter-evans/find-comment@v2
        with:
          issue-number: ${{github.event.pull_request.number}}
          comment-author: 'github-actions[bot]'
          body-includes: 'Animation Report'
      - name: Comment Animation Report
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.test.outcome != 'skipped' }}
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{steps.find-comment.outputs.comment-id}}
          issue-number: ${{github.event.pull_request.number}}
          edit-mode: replace
          body: |
            🎬 **Animation Report** ${{ steps.test.outcome == 'success' && '✅' || '❌' }} · [View Report](${{ steps.deploy-report.outcome == 'success' && format('https://{0}-animations--{1}.netlify.app', github.event.pull_request.number, secrets.NETLIFY_SITE_NAME) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }})

  pr-website-visual-regression-test:
    name: PR Website Visual Regression Test (${{matrix.browser}}, ${{matrix.theme}}, ${{matrix.density}})
    timeout-minutes: 40
    permissions:
      contents: read
    # This job intentionally does not use the `ubuntu-latest` image.
    # An updated image could generate different snapshots, so we should explicitly update the image version.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: ['chromium', 'firefox']
        theme: ['light', 'dark']
        density: ['default', 'compact']
    env:
      CLARITY_VRT_BROWSER: ${{matrix.browser}}
      CLARITY_VRT_THEME: ${{matrix.theme}}
      CLARITY_VRT_DENSITY: ${{matrix.density}}
      CLARITY_VRT_SUITE: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{matrix.browser}}
      - name: Cache Website Build
        id: website-cache
        uses: actions/cache@v4
        with:
          path: dist/website
          key: website-build-${{hashFiles('package-lock.json', 'projects/website/**', 'projects/angular/**', 'projects/ui/**', 'projects/addons/**', 'angular.json', 'tsconfig.json')}}
      - name: Build Website
        if: steps.website-cache.outputs.cache-hit != 'true'
        run: npm run _build:website
      - name: Update Visual Snapshots
        run: npx playwright test --update-snapshots
      - name: Collect Changes
        id: diff
        run: |
          git add .
          git diff --cached --binary > visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
      - name: Upload Changes
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
          path: visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
