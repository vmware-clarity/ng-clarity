name: PR Build
on:
  pull_request:
concurrency:
  group: pr-build-${{github.event.pull_request.number}}
  cancel-in-progress: true
jobs:
  pr-build:
    name: PR Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Public Api Check
        run: npm run public-api:check
      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist/docs/
      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/website/
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  pr-visual-regression-test:
    name: PR Visual Regression Test (${{matrix.browser}}, ${{matrix.theme}}, ${{matrix.density}}, shard ${{matrix.shard}}/2)
    timeout-minutes: 40
    # This job intentionally does not use the `ubuntu-latest` image.
    # An updated image could generate different snapshots, so we should explicitly update the image version.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: ['chromium', 'firefox']
        theme: ['light', 'dark']
        density: ['default', 'compact']
        shard: [1, 2]
    env:
      CLARITY_VRT_BROWSER: ${{matrix.browser}}
      CLARITY_VRT_THEME: ${{matrix.theme}}
      CLARITY_VRT_DENSITY: ${{matrix.density}}
      CLARITY_VRT_SHARD: ${{matrix.shard}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{matrix.browser}}
      - name: Cache Storybook Build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: dist/docs
          key: storybook-build-${{hashFiles('package-lock.json', 'projects/angular/**', 'projects/ui/**', '.storybook/**', 'angular.json')}}
      - name: Build Storybook
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        run: npm run _build:storybook
      - name: Update Visual Snapshots
        run: npx playwright test --update-snapshots --shard=${{matrix.shard}}/2
      - name: Collect Changes
        id: diff
        run: |
          git add .
          git diff --cached --binary > visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff
      - name: Upload Changes
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff
          path: visual-snapshot-changes-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}-${{matrix.shard}}.diff

  pr-animation-recordings:
    name: PR Animation Recordings
    timeout-minutes: 40
    # Same image as the visual regression tests: an updated image could record animations differently.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Cache Storybook Build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: dist/docs
          key: animation-recordings-storybook-build-${{hashFiles('package-lock.json', 'projects/angular/**', 'projects/addons/**', 'projects/ui/**', '.storybook/**', 'angular.json')}}
      - name: Build Storybook
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        run: npm run _build:storybook
      # Records the animations and updates the recordings of tests/animations/recordings that changed, like the visual
      # snapshots: the PR Visual Snapshot Update Bot offers the changes as a commit to cherry-pick.
      - name: Update Animation Recordings
        run: npm run animations:update
      - name: Collect Changes
        id: animation-changes
        run: |
          git add tests/animations/recordings
          git diff --cached --binary > visual-snapshot-changes-animations.diff
          if [ -s visual-snapshot-changes-animations.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Only when there are changes: the bot cannot apply an empty patch.
      - name: Upload Changes
        if: ${{ steps.animation-changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-animations.diff
          path: visual-snapshot-changes-animations.diff
      - name: Summarize
        if: ${{ hashFiles('dist/animation-recordings/baseline-vs-current.md') != '' }}
        run: cat dist/animation-recordings/baseline-vs-current.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Animation Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: animation-report
          path: dist/animation-recordings/

  pr-website-visual-regression-test:
    name: PR Website Visual Regression Test (${{matrix.browser}}, ${{matrix.theme}}, ${{matrix.density}})
    timeout-minutes: 40
    permissions:
      contents: read
    # This job intentionally does not use the `ubuntu-latest` image.
    # An updated image could generate different snapshots, so we should explicitly update the image version.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: ['chromium', 'firefox']
        theme: ['light', 'dark']
        density: ['default', 'compact']
    env:
      CLARITY_VRT_BROWSER: ${{matrix.browser}}
      CLARITY_VRT_THEME: ${{matrix.theme}}
      CLARITY_VRT_DENSITY: ${{matrix.density}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{matrix.browser}}
      - name: Cache Website Build
        id: website-cache
        uses: actions/cache@v4
        with:
          path: dist/website
          key: website-build-${{hashFiles('package-lock.json', 'projects/website/**', 'projects/angular/**', 'projects/ui/**', 'projects/addons/**', 'angular.json', 'tsconfig.json')}}
      - name: Build Website
        if: steps.website-cache.outputs.cache-hit != 'true'
        run: npm run _build:website
      - name: Update Visual Snapshots
        run: npx playwright test --config playwright-website.config.ts --update-snapshots
      - name: Collect Changes
        id: diff
        run: |
          git add .
          git diff --cached --binary > visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
      - name: Upload Changes
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
          path: visual-snapshot-changes-website-${{matrix.browser}}-${{matrix.theme}}-${{matrix.density}}.diff
