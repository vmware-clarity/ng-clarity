<appfx-filter-form
  [formGroup]="enumFilterForm"
  [valid]="enumFilterForm.valid"
  (cancel)="onCancelButtonClick()"
  (apply)="onApplyButtonClick()"
>
  <div class="filter-field-row">
    <ng-content select="[filterField]"></ng-content>
  </div>
  <ng-content select="[filterActions]" ngProjectAs="[filterActions]"></ng-content>
  <div class="enum-filter-wrapper filter-scroll-region">
    <div *ngIf="additionalOperators" class="filter-condition-row">
      <clr-select-container class="enum-operator">
        <label class="clr-sr-only">
          {{ filterStrings.operatorLabel }}
        </label>
        <select clrSelect formControlName="enumOperator">
          <option *ngFor="let operator of enumOperators; trackBy: trackByOperator" [ngValue]="operator">
            {{ filterStrings.getOperatorDisplayName(operator) }}
          </option>
        </select>
      </clr-select-container>
    </div>

    <label class="clr-control-label text-left mt-compact">
      {{ filterStrings.valueLabel }}
    </label>

    <!-- The search narrows the options below; it is not part of the condition, so it sits under Value. -->
    <div *ngIf="filterProperty.searchable" class="filter-condition-row enum-search" data-test-id="enum-search">
      <clr-input-container class="filter-value">
        <label class="clr-sr-only">{{ filterStrings.searchOptions }}</label>
        <input clrInput type="text" [placeholder]="filterStrings.searchPlaceholder" formControlName="searchTerm" />
        <cds-icon shape="search" clrInputPrefix></cds-icon>
        <cds-icon
          *ngIf="enumFilterForm.get('searchTerm')?.value"
          shape="window-close"
          clrInputSuffix
          (click)="clearSearch()"
        ></cds-icon>
        <clr-control-helper *ngIf="filteredOptions.length">
          {{
            filterStrings.formatString(filterStrings.showingFormat, [
              filteredOptions.length.toString(),
              searchResultsLen.toString(),
            ])
          }}
        </clr-control-helper>
        <clr-control-helper *ngIf="filteredOptions.length === 0 && enumFilterForm.get('searchTerm')?.value">
          {{ filterStrings.noValuesFound }}
        </clr-control-helper>
      </clr-input-container>
    </div>

    <div *ngIf="filteredOptions.length" cds-layout="m-t:xs m-l:xxs" class="selection-counter">
      <span *ngIf="!filterProperty.singleSelect" class="clr-subtext" cds-text="body medium">
        {{ filterStrings.formatString(filterStrings.elementsSelectedFormat, [selectedCount.toString()]) }}
      </span>
    </div>

    <div *ngIf="isProcessing" class="loading-overlay">
      <div class="loading-content">
        <clr-spinner clrMedium>{{ filterStrings.loading }}</clr-spinner>
      </div>
    </div>

    <div class="filter-options" cds-layout="m-t:xs">
      <clr-checkbox-container *ngIf="!filterProperty.singleSelect" class="enum-options">
        <clr-checkbox-wrapper *ngIf="filterProperty.enableSelectAll" cds-layout="m-b:xs">
          <input type="checkbox" clrCheckbox formControlName="selectAll" (change)="onSelectAllChange()" />
          <label>
            {{ enumFilterForm.get('searchTerm')?.value ? filterStrings.allSearchResults : filterStrings.selectAll }}
          </label>
        </clr-checkbox-wrapper>

        <clr-checkbox-wrapper *ngFor="let item of filteredOptions; trackBy: trackByFilteredOption">
          <input
            type="checkbox"
            clrCheckbox
            [formControl]="$any(optionsFormArray.at(item.index))"
            (change)="onOptionChange()"
          />
          <label>
            {{ item.data.value }}
          </label>
        </clr-checkbox-wrapper>
      </clr-checkbox-container>

      <clr-radio-container *ngIf="filterProperty.singleSelect" class="enum-options">
        <clr-radio-wrapper *ngFor="let option of filteredOptions; trackBy: trackByFilteredOption">
          <input type="radio" clrRadio formControlName="singleSelectOption" [value]="option.data.key" />
          <label>
            {{ option.data.value }}
          </label>
        </clr-radio-wrapper>
      </clr-radio-container>

      <!-- At the end of the scrolling list, so it shows once the user reaches the last loaded option. -->
      <button
        *ngIf="filteredOptions.length < searchResultsLen"
        type="button"
        class="btn btn-link enum-load-more"
        data-test-id="load-more"
        (click)="loadMore()"
      >
        {{ filterStrings.loadMore }}
      </button>
    </div>
  </div>
</appfx-filter-form>
