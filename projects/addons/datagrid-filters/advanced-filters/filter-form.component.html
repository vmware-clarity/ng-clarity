<form clrForm class="form-compact" clrLayout="vertical">
  <div class="form-max-height">
    <ng-content></ng-content>
  </div>
  <div class="filter-form-actions">
    <div class="filter-extra-actions">
      <ng-content select="[filterActions]"></ng-content>
    </div>
    <button type="button" data-test-id="cancelBtn" class="btn btn-sm btn-outline" (click)="onCancelButtonClick()">
      {{ filterStrings.cancel }}
    </button>
    <button
      type="button"
      data-test-id="submitBtn"
      class="btn btn-sm btn-primary"
      [disabled]="!valid"
      (click)="onApplyButtonClick()"
    >
      {{ filterStrings.apply }}
    </button>
  </div>
</form>
