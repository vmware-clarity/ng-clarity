<clr-label class="filter-pill-label" [clrColor]="active ? 'info' : ''">
  <clr-tooltip>
    <button
      #pillButton
      type="button"
      class="filter-pill"
      [class.filter-pill-active]="active"
      clrTooltipTrigger
      [attr.aria-label]="editFilterAriaLabel"
      [attr.aria-expanded]="open"
      [attr.aria-controls]="popoverId"
      (click)="togglePopover($event)"
    >
      <span class="filter-pill-text">
        @if (active) {
          {{ managedProperty.displayName }}: <span class="filter-pill-condition">{{ pillCondition }}</span>
        } @else {
          {{ managedProperty.displayName }}
        }
      </span>
      @if (additionalConditions > 0) {
        <clr-badge class="filter-pill-count" clrColor="info" clrType="solid" aria-hidden="true"
          >+{{ additionalConditions }}</clr-badge
        >
      }
      <cds-icon shape="angle" direction="down" size="16" aria-hidden="true"></cds-icon>
    </button>
    @if (!open) {
      <!-- Visual only: the pill's aria-label already holds the full filter. The empty id removes the trigger's
           aria-describedby, which would be read even with aria-hidden. -->
      <clr-tooltip-content [id]="''" aria-hidden="true" clrPosition="top-right" clrSize="lg">{{
        tooltipText
      }}</clr-tooltip-content>
    }
  </clr-tooltip>
  @if (!predefined) {
    <button
      type="button"
      class="filter-pill-remove"
      data-test-id="remove-pill"
      [attr.aria-label]="filterStrings.removeFilterText + ' ' + managedProperty.displayName"
      (click)="filterRemoved.emit()"
    >
      <cds-icon shape="window-close" size="16" aria-hidden="true"></cds-icon>
    </button>
  }
</clr-label>
<div
  class="filter-popover"
  role="dialog"
  [id]="popoverId"
  [attr.aria-label]="filterStrings.editFilterText + ' ' + managedProperty.displayName"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  *clrPopoverContent="open; at: popoverPosition; type: popoverType; outsideClickToClose: true; scrollToClose: false"
>
  <ng-template #fieldSelector>
    <h5 cds-layout="m-t:none" data-test-id="filter-field-name">
      {{ managedProperty.displayName }}
    </h5>
  </ng-template>
  <ng-template #filterActions>
    @if (active) {
      <button type="button" class="btn btn-sm btn-link" data-test-id="clear-filter" (click)="removeFilter()">
        {{ predefined ? filterStrings.clearFilter : filterStrings.removeFilterText }}
      </button>
    }
  </ng-template>
  <appfx-filter-editor
    [property]="managedProperty"
    [propertyFilter]="propertyFilter"
    [fieldTemplate]="fieldSelector"
    [actionsTemplate]="filterActions"
    (filterCriteriaChange)="onFilterCriteriaChange($event)"
  ></appfx-filter-editor>
</div>
