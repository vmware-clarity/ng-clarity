<clr-label class="filter-pill-label" [clrColor]="active ? 'info' : ''">
  <button
    type="button"
    class="filter-pill"
    [class.filter-pill-active]="active"
    clrPopoverOrigin
    clrPopoverOpenCloseButton
    [attr.aria-label]="editFilterAriaLabel"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="popoverId"
    [title]="editFilterAriaLabel"
  >
    <span class="filter-pill-text">{{ pillText }}</span>
    @if (additionalConditions > 0) {
      <clr-badge class="filter-pill-count" clrColor="info" clrType="solid" aria-hidden="true"
        >+{{ additionalConditions }}</clr-badge
      >
    }
    <cds-icon shape="angle" direction="down" size="16" aria-hidden="true"></cds-icon>
  </button>
</clr-label>
<div
  class="filter-popover"
  role="dialog"
  [id]="popoverId"
  [attr.aria-label]="filterStrings.editFilterText + ' ' + managedProperty.displayName"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  *clrPopoverContent="open; at: popoverPosition; type: popoverType; outsideClickToClose: true; scrollToClose: false"
>
  <div class="filter-popover-header">
    <span class="clr-control-label">{{ managedProperty.displayName }}</span>
    @if (active) {
      <button type="button" class="btn btn-sm btn-link" data-test-id="clear-filter" (click)="removeFilter()">
        {{ predefined ? filterStrings.clearFilter : filterStrings.removeFilterText }}
      </button>
    }
  </div>
  @switch (managedPropertyType) {
    @case (stringPropertyType) {
      <appfx-general-filter
        [filterProperty]="stringProperty"
        [propertyFilter]="propertyFilter"
        (filterCriteriaChange)="onFilterCriteriaChange($event)"
      ></appfx-general-filter>
    }
    @case (numericPropertyType) {
      <appfx-general-filter
        [filterProperty]="numericProperty"
        [propertyFilter]="propertyFilter"
        (filterCriteriaChange)="onFilterCriteriaChange($event)"
      ></appfx-general-filter>
    }
    @case (enumPropertyType) {
      <appfx-enum-filter
        [filterProperty]="enumProperty"
        [propertyFilter]="propertyFilter"
        (filterCriteriaChange)="onFilterCriteriaChange($event)"
      ></appfx-enum-filter>
    }
    @case (dateTimePropertyType) {
      <appfx-datetime-filter
        [filterProperty]="dateTimeProperty"
        [propertyFilter]="propertyFilter"
        (filterCriteriaChange)="onFilterCriteriaChange($event)"
      ></appfx-datetime-filter>
    }
    @case (userPropertyType) {
      <appfx-users-filter
        [filterProperty]="userProperty"
        [propertyFilter]="propertyFilter"
        (filterCriteriaChange)="onFilterCriteriaChange($event)"
      ></appfx-users-filter>
    }
  }
</div>
