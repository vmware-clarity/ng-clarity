@if (card?.collapsible) {
<button
  type="button"
  class="clr-card-header-toggle"
  (click)="card.expandService.toggle()"
  [attr.aria-controls]="card.contentId"
  [attr.aria-expanded]="card.expandService.expanded"
  [attr.aria-label]="card.expandService.expanded ? commonStrings.keys.collapseCardAriaLabel : commonStrings.keys.expandCardAriaLabel"
>
  <cds-icon
    [shape]="card.expandService.expanded ? 'collapse-card' : 'expand-card'"
    [flip]="'vertical'"
    class="clr-card-header-icon"
  ></cds-icon>
</button>
}
<ng-content></ng-content>
