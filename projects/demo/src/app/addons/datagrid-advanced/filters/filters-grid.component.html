<form clrForm>
  <clr-select-container cds-layout="m-t:xs">
    <label>Filter mode</label>
    <select clrSelect name="filter-mode" [ngModel]="selectedFilterMode" (ngModelChange)="onFilterModeChange($event)">
      <option [value]="FilterMode.AdvancedOnly" selected>Advanced Only Filter</option>
      <option [value]="FilterMode.Advanced">Advanced Filter</option>
      <option [value]="FilterMode.Quick">Quick Filter</option>
      <option [value]="undefined">No filter</option>
    </select>
  </clr-select-container>
</form>

<appfx-datagrid
  [gridItems]="filteredItems"
  [columns]="columns"
  [layoutModel]="{
    compact: false,
    stretchToParentHeight: false,
  }"
  [filterableProperties]="filterableProperties"
  [filterMode]="selectedFilterMode"
  [selectionType]="selectionType"
  [pageSize]="10"
  [rowSelectionMode]="false"
  (searchTermChange)="onSearchTermChange($event)"
  (advancedFilterChange)="onAdvancedFilterChange($event)"
>
</appfx-datagrid>

<clr-toggle-container cds-layout="m-l:xxs m-t:md">
  <label>User Filter Error Simulation</label>
  <clr-toggle-wrapper>
    <input type="checkbox" clrToggle [(ngModel)]="isErrorRetrievingDomains" />
    <label>Simulate error in retrieving domains for the Users advanced filter.</label>
  </clr-toggle-wrapper>
  <clr-toggle-wrapper>
    <input type="checkbox" clrToggle [(ngModel)]="isErrorRetrievingUsers" />
    <label>Simulate error in searching users for the Users advanced filter.</label>
  </clr-toggle-wrapper>
</clr-toggle-container>

<section aria-labelledby="predefined-filters-heading" cds-layout="m-t:xl">
  <h2 id="predefined-filters-heading">Predefined filters</h2>
  <p cds-layout="m-b:md">
    VM Name, State, and Status stay visible when cleared. Status starts with Warning and Alert selected. Use Add New to
    filter by other fields.
  </p>
  <appfx-datagrid-filters
    [filterMode]="FilterMode.AdvancedOnly"
    [filterableProperties]="filterableProperties"
    [predefinedFilters]="predefinedFilters"
    [presetFilters]="presetFilters"
    (propertyFiltersChange)="onPredefinedFilterChange($event)"
  ></appfx-datagrid-filters>
  <appfx-datagrid
    [gridItems]="predefinedFilteredItems"
    [columns]="columns"
    [layoutModel]="{
      compact: false,
      stretchToParentHeight: false,
    }"
    [selectionType]="selectionType"
    [pageSize]="10"
    [rowSelectionMode]="false"
  ></appfx-datagrid>
</section>
