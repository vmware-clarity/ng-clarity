<h2>Pinnable columns</h2>

<p>
  A column definition with <code class="clr-code">pinned</code> is rendered to the left of the scrollable columns and
  stays visible while the grid is scrolled horizontally.
</p>

<p>VM Name and Status start pinned, and the remaining columns are scrollable.</p>

<!--
  Disabled with clrDgPinnable. Restoring it means putting pinnable back on the State and Status
  column definitions, restoring (columnPinnedChange) on the grid below, and restoring this copy:

  <p>
    Adding <code class="clr-code">pinnable</code> puts a pin toggle in the column header, so the user can pin and unpin
    the column themselves.
  </p>

  <p>
    VM Name starts pinned and is pinnable, State and Status are pinnable but start loose, and the remaining columns
    cannot be pinned at all.
  </p>
-->

<div class="card card-block">
  <p class="card-text">Pinned columns: {{ pinnedColumns || 'none' }}</p>
  <!-- Disabled with clrDgPinnable: <p class="card-text">Last change: {{ lastPinnedChange || 'none yet' }}</p> -->
</div>

<hr />

<appfx-datagrid
  [gridItems]="vms"
  [columns]="columns"
  [selectedItems]="selectedVms"
  [selectionType]="SelectionType.Multi"
  [layoutModel]="{ stretchToParentHeight: false }"
  [footerModel]="{ showFooter: true }"
  [pageSize]="10"
  (selectedItemsChange)="onSelectedItemsChange($event)"
>
</appfx-datagrid>
