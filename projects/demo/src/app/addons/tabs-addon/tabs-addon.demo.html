<h1>Tabs</h1>

<form clrForm class="clr-form-compact">
  <clr-radio-container clrInline>
    <label>Layout</label>
    <clr-radio-wrapper>
      <input type="radio" clrRadio name="layout" [value]="TabLayout.horizontal" [(ngModel)]="selectedLayout" />
      <label>Horizontal</label>
    </clr-radio-wrapper>
    <clr-radio-wrapper>
      <input type="radio" clrRadio name="layout" [value]="TabLayout.vertical" [(ngModel)]="selectedLayout" />
      <label>Vertical</label>
    </clr-radio-wrapper>
    <clr-radio-wrapper>
      <input type="radio" clrRadio name="layout" [value]="TabLayout.secondary" [(ngModel)]="selectedLayout" />
      <label>Secondary</label>
    </clr-radio-wrapper>
  </clr-radio-container>

  <clr-toggle-container>
    <label>Disable tab content</label>
    <clr-toggle-wrapper>
      <input type="checkbox" name="disable-content" clrToggle [(ngModel)]="disableContent" />
    </clr-toggle-wrapper>
  </clr-toggle-container>

  <clr-toggle-container>
    <label>Show tab links</label>
    <clr-toggle-wrapper>
      <input type="checkbox" name="show-tabs" clrToggle [(ngModel)]="showTabLinks" />
    </clr-toggle-wrapper>
  </clr-toggle-container>
</form>

<div class="tabs-demo-container">
  <appfx-tabs
    [tabs]="steps"
    [model]="tabsModel"
    [tabLayout]="selectedLayout"
    [disableTabsContent]="disableContent"
    [showTabLinks]="showTabLinks"
  >
  </appfx-tabs>
</div>
