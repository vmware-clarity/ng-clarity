<h4>Icons in Solid Buttons</h4>
<button type="submit" class="btn btn-primary">
  <clr-icon shape="user"></clr-icon>
  <span> Primary </span>
  <clr-icon shape="home"></clr-icon>
</button>
<button type="submit" class="btn btn-success">
  <clr-icon shape="user"></clr-icon> Success <clr-icon shape="home"></clr-icon>
</button>
<button type="submit" class="btn btn-warning"><clr-icon shape="user"></clr-icon> Warning</button>
<button type="submit" class="btn btn-danger">Danger <clr-icon shape="user"></clr-icon></button>

<h4>Icons in Small Buttons</h4>
<button type="submit" class="btn btn-sm btn-primary">
  <clr-icon shape="user"></clr-icon>
  <span> Primary </span>
  <clr-icon shape="home"></clr-icon>
</button>
<button type="submit" class="btn btn-sm btn-success-outline">
  <clr-icon shape="user"></clr-icon> Success <clr-icon shape="home"></clr-icon>
</button>
<button type="submit" class="btn btn-sm btn-warning"><clr-icon shape="user"></clr-icon> Warning</button>
<button type="submit" class="btn btn-sm btn-danger-outline">Danger <clr-icon shape="user"></clr-icon></button>

<h4>Icons in Disabled Solid Buttons</h4>
<button type="submit" class="btn btn-primary" disabled><clr-icon shape="user"></clr-icon> Primary</button>
<button type="submit" class="btn btn-success" disabled><clr-icon shape="user"></clr-icon> Success</button>
<button type="submit" class="btn btn-warning" disabled><clr-icon shape="user"></clr-icon> Warning</button>
<button type="submit" class="btn btn-danger" disabled><clr-icon shape="user"></clr-icon> Danger</button>

<h4>Icons in Outline Buttons</h4>
<button type="submit" class="btn btn-outline"><clr-icon shape="user"></clr-icon> Regular</button>
<button type="submit" class="btn btn-success-outline"><clr-icon shape="user"></clr-icon> Success-Outline</button>

<button type="submit" class="btn btn-warning-outline"><clr-icon shape="user"></clr-icon> Warning</button>
<button type="submit" class="btn btn-danger-outline"><clr-icon shape="user"></clr-icon> Danger</button>

<h4>Icons in Disabled Outline Buttons</h4>
<button type="submit" class="btn btn-outline" disabled><clr-icon shape="user"></clr-icon> Regular</button>
<button type="submit" class="btn btn-success-outline" disabled>
  <clr-icon shape="user"></clr-icon> Success-Outline
</button>
<button type="submit" class="btn btn-info-outline" disabled><clr-icon shape="user"></clr-icon> Info</button>

<button type="submit" class="btn btn-danger-outline" disabled><clr-icon shape="user"></clr-icon> Danger</button>

<h4>Icons in Flat Buttons</h4>
<button type="submit" class="btn btn-link"><clr-icon shape="user"></clr-icon> Regular</button>
<button type="submit" class="btn btn-link" disabled><clr-icon shape="user"></clr-icon> Disabled</button>
