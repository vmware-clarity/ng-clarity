<section
  clrContext="Host inventory for the selected datacenter"
  clrContextType="section"
  [clrContextState]="{ datacenter: 'eu-west', selectedHosts: selectedHosts.length }"
>
  <h3>Host inventory</h3>

  @if (alertVisible) {
    <clr-alert clrAlertType="warning" (clrAlertClosedChange)="alertVisible = false">
      <clr-alert-item>
        <span class="alert-text">esx-edge-01 has been disconnected for 3 hours</span>
      </clr-alert-item>
    </clr-alert>
  }

  <clr-datagrid [(clrDgSelected)]="selectedHosts" [clrDgSelectionType]="'multi'">
    <clr-dg-column [clrDgField]="'name'">Name</clr-dg-column>
    <clr-dg-column [clrDgField]="'cluster'">Cluster</clr-dg-column>
    <clr-dg-column>Status</clr-dg-column>
    <clr-dg-row *clrDgItems="let host of hosts" [clrDgItem]="host">
      <clr-dg-cell>{{ host.name }}</clr-dg-cell>
      <clr-dg-cell>{{ host.cluster }}</clr-dg-cell>
      <clr-dg-cell>{{ host.status }}</clr-dg-cell>
    </clr-dg-row>
    <clr-dg-footer>{{ hosts.length }} hosts</clr-dg-footer>
  </clr-datagrid>

  <button type="button" class="btn btn-primary" (click)="addHostOpen = true">Add host</button>
  <button type="button" class="btn" [disabled]="selectedHosts.length === 0">Enter maintenance mode</button>
</section>

<clr-modal [(clrModalOpen)]="addHostOpen">
  <h3 class="modal-title">Add host</h3>
  <div class="modal-body">
    <form clrForm clrLayout="vertical">
      <clr-input-container>
        <label>Host name</label>
        <input clrInput required name="hostName" [(ngModel)]="newHostName" placeholder="esx-prod-04" />
      </clr-input-container>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="addHostOpen = false">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="addHostOpen = false">Add</button>
  </div>
</clr-modal>
