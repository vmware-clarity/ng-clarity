<h6>A. Rotated: Set the orientation by using the <code>direction</code> attribute</h6>

<span class="clr-example">
  <clr-icon shape="angle" direction="up"></clr-icon>
  <clr-icon shape="angle" direction="right"></clr-icon>
  <clr-icon shape="angle" direction="down"></clr-icon>
  <clr-icon shape="angle" direction="left"></clr-icon>
</span>

<h6>B. Rotated: Set the icon orientation in the <code>dir</code> attribute</h6>

<span class="clr-example">
  <clr-icon shape="angle" direction="up"></clr-icon>
  <clr-icon shape="angle" direction="right"></clr-icon>
  <clr-icon shape="angle" direction="down"></clr-icon>
  <clr-icon shape="angle" direction="left"></clr-icon>
</span>

<h6>C. Flipped: Set the icon flip orientation in the <code>flip</code> attribute</h6>

<span class="clr-example">
  <clr-icon shape="floppy"></clr-icon>
  <clr-icon shape="floppy" flip="horizontal"></clr-icon>
  <clr-icon shape="floppy" flip="vertical"></clr-icon>
</span>
