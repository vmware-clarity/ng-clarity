<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Billing widget</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 12px;
        font-size: 13px;
      }
      h1 {
        font-size: 16px;
        margin-top: 0;
      }
      pre {
        background: #f4f4f4;
        padding: 8px;
        white-space: pre-wrap;
        max-height: 10rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Billing (third party)</h1>
    <p>
      This page is served from a different origin, so the host cannot read anything inside it. What it can do is answer
      when this page asks for context over <code>postMessage</code>:
    </p>
    <button id="ask" type="button">Request host page context</button>
    <button type="button">Pay invoice</button>
    <pre id="out"></pre>
    <script>
      // The host's origin, disclosed by the embedder through the referrer. The answer is
      // accepted only from the window that was asked, and only from that origin. Without a
      // referrer there is no origin to trust, and nothing is asked: a request broadcast to
      // '*' could be answered by whatever the parent has navigated to since.
      // Demo only: trusting the referrer trusts whichever page embeds this one, which can
      // then answer with a made-up context. A deployed plugin names the origin of the
      // application it is built for as a constant, as the guide's snippet does. The
      // referrer is also this frame's own previous page once it navigates.
      var hostOrigin = document.referrer ? new URL(document.referrer).origin : null;
      // An unguessable id. crypto.randomUUID() exists only in a secure context (HTTPS or
      // localhost), and this demo may be opened over plain HTTP on a LAN address, so it falls
      // back to crypto.getRandomValues(), which is available everywhere.
      function newRequestId() {
        if (typeof crypto.randomUUID === 'function') {
          return crypto.randomUUID();
        }
        return Array.from(crypto.getRandomValues(new Uint8Array(16)), function (byte) {
          return byte.toString(16).padStart(2, '0');
        }).join('');
      }
      var requestId = newRequestId();
      window.addEventListener('message', function (event) {
        var message = event.data;
        if (event.source !== window.parent || event.origin !== hostOrigin) {
          return;
        }
        if (
          message &&
          message.protocol === 'ui-context/v1' &&
          message.kind === 'context-response' &&
          message.requestId === requestId
        ) {
          document.getElementById('out').textContent = JSON.stringify(message.context, null, 2);
        }
      });
      document.getElementById('ask').addEventListener('click', function () {
        if (!hostOrigin) {
          document.getElementById('out').textContent = 'No referrer from the embedder: no host origin to ask.';
          return;
        }
        requestId = newRequestId();
        window.parent.postMessage(
          { protocol: 'ui-context/v1', kind: 'context-request', requestId: requestId, options: { maxComponents: 40 } },
          hostOrigin
        );
      });
    </script>
  </body>
</html>
