<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monitoring plugin</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 12px;
        font-size: 13px;
      }
      h1 {
        font-size: 16px;
        margin-top: 0;
      }
      iframe {
        width: 100%;
        height: 6rem;
        border: 1px dashed #999;
      }
    </style>
  </head>
  <body>
    <h1>Monitoring</h1>
    <p>Cluster health: <strong>degraded</strong>. The alerts widget below is a second frame nested inside this one.</p>
    <iframe
      title="Alerts widget"
      src="alerts.html"
      sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads"
    ></iframe>
    <p><a href="/demo/datagrid">Open the full datagrid</a></p>
  </body>
</html>
