<h4>Loading buttons with disabled input</h4>
<button
  [clrLoading]="disabledState"
  [disabled]="disabledStateDisabled"
  type="submit"
  class="btn btn-primary"
  (click)="disabledDemo()"
>
  <clr-icon shape="home"></clr-icon>
  Disable After Success
</button>
<button
  [clrLoading]="enabledState"
  [disabled]="enabledStateDisabled"
  type="submit"
  class="btn btn-primary"
  (click)="enabledDemo()"
>
  Enable After Success
</button>

<h4>Small loading buttons</h4>
<button [clrLoading]="validateSmState" class="btn btn-sm btn-info-outline" (click)="validateSmDemo()">
  <clr-icon shape="home"></clr-icon>
  Validate
</button>
<button
  [clrLoading]="submitSmState"
  type="submit"
  class="btn btn-sm btn-success-outline"
  (click)="submitSmDemo()"
>
  <clr-icon shape="home"></clr-icon>
  Submit
</button>
<button
  [clrLoading]="validateFalsyState"
  class="btn btn-sm btn-info-outline"
  (click)="validateFalsyDemo()"
>
  Validate
</button>
