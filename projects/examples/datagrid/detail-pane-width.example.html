<div class="card">
  <p class="card-block" cds-layout="m-t:none">
    <clr-range-container cds-layout="m-t:none" [clrRangeHasProgress]="true">
      <label>
        Detail Pane Width:
        <strong>{{ detailWidth }}%</strong>
      </label>
      <input
        type="range"
        clrRange
        id="widthSlider"
        min="0"
        max="100"
        step="5"
        [(ngModel)]="detailWidth"
      />
    </clr-range-container>
  </p>
</div>

<clr-datagrid>
  <clr-dg-column>User ID</clr-dg-column>
  <clr-dg-column>Name</clr-dg-column>

  <clr-dg-row *clrDgItems="let user of users" [clrDgItem]="user">
    <clr-dg-cell>{{ user.id }}</clr-dg-cell>
    <clr-dg-cell>{{ user.name }}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-detail *clrIfDetail="let detail" [clrDetailWidth]="detailWidth">
    <clr-dg-detail-header>{{ detail.name }}</clr-dg-detail-header>
    <clr-dg-detail-body>
      <b cds-text="medium">Additional Details</b>
      <table class="table">
        <tr>
          <th>Property</th>
          <th>Value</th>
        </tr>
        <tr>
          <td>ID</td>
          <td>{{ detail.id }}</td>
        </tr>
        <tr>
          <td>Wins</td>
          <td>{{ detail.wins }}</td>
        </tr>
      </table>
    </clr-dg-detail-body>
  </clr-dg-detail>

  <clr-dg-footer>{{ users.length }} users</clr-dg-footer>
</clr-datagrid>
