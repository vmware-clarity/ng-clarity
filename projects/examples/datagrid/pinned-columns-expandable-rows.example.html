<clr-datagrid>
  <clr-dg-column clrDgPinned [style.width.px]="240">User ID</clr-dg-column>
  <clr-dg-column [style.width.px]="240">Name</clr-dg-column>
  <clr-dg-column [style.width.px]="280">Creation date</clr-dg-column>
  <clr-dg-column [style.width.px]="280">Pokemon</clr-dg-column>

  <clr-dg-row *clrDgItems="let user of users" [clrDgItem]="user">
    <clr-dg-cell>{{ user.id }}</clr-dg-cell>
    <clr-dg-cell>{{ user.name }}</clr-dg-cell>
    <clr-dg-cell>{{ user.creation | date }}</clr-dg-cell>
    <clr-dg-cell>{{ user.pokemon.name }}</clr-dg-cell>

    <clr-dg-row-detail *clrIfExpanded>
      <clr-dg-cell>{{ user.id }}</clr-dg-cell>
      <clr-dg-cell>{{ user.name }}</clr-dg-cell>
      <clr-dg-cell>{{ user.creation | date: 'long' }}</clr-dg-cell>
      <clr-dg-cell>{{ user.pokemon.name }} ({{ user.pokemon.number }})</clr-dg-cell>
    </clr-dg-row-detail>
  </clr-dg-row>

  <clr-dg-footer>{{ users.length }} users</clr-dg-footer>
</clr-datagrid>
