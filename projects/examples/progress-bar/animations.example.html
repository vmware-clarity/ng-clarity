@for (progress of progressBars; track progress.title) {
<h4>{{ progress.title }}</h4>
<div [class]="progress.cssClassnames">
  <progress [value]="progress.value" max="100" [attr.data-displayval]="progress.value + '%'"></progress>
  @if (progress.isLabeled) {
  <span>{{ progress.value }}%</span>
  }
</div>
<p><button class="btn btn-outline" (click)="progress.start()">Show</button></p>
}
