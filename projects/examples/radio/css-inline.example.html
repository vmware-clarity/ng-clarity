  <label class="clr-control-label">Inline radio example</label>
  <div class="clr-control-container clr-control-inline">
    <div class="clr-radio-wrapper">
      <input type="radio" id="radio7" name="radio-inline" value="option1" class="clr-radio" />
      <label for="radio7" class="clr-control-label">option 1</label>
    </div>
    <div class="clr-radio-wrapper">
      <input type="radio" id="radio8" name="radio-inline" value="option2" class="clr-radio" />
      <label for="radio8" class="clr-control-label">option 2</label>
    </div>
    <div class="clr-radio-wrapper">
      <input type="radio" id="radio9" name="radio-inline" value="option3" class="clr-radio" />

      <cds-icon class="clr-validate-icon" shape="error-standard" status="danger"></cds-icon>
      <span class="clr-subtext">Error message</span>
    </div>
  </div>
