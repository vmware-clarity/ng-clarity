@if (downloadingFile) {
<div>
  <clr-spinner clrInline>Downloading</clr-spinner>
  <span>Downloading</span>
</div>
} @if (!downloadingFile) {
<button (click)="toggleSpinner()" class="btn btn-primary">Download file</button>
} @else {
<button class="btn" (click)="toggleSpinner()">Cancel file download</button>
}
