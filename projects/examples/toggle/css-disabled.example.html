<div class="clr-form-control clr-form-control-disabled">
  <label class="clr-control-label">Disabled toggle switches example</label>
  <div class="clr-control-container">
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-disabled-1"
        name="toggle-disabled"
        value="option1"
        class="clr-toggle"
        disabled
      />
      <label for="toggle-disabled-1" class="clr-control-label">option 1</label>
    </div>
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-disabled-2"
        name="toggle-disabled"
        value="option2"
        class="clr-toggle"
        disabled
      />
      <label for="toggle-disabled-2" class="clr-control-label">option 2</label>
    </div>
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-disabled-3"
        name="toggle-disabled"
        value="option3"
        class="clr-toggle"
        disabled
      />
      <label for="toggle-disabled-3" class="clr-control-label">option 3</label>
    </div>
    <div class="clr-subtext-wrapper">
      <span class="clr-subtext">Helper Text</span>
    </div>
  </div>
</div>
