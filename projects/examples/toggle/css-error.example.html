<div class="clr-form-control">
  <label class="clr-control-label">Basic toggle switch</label>
  <div class="clr-control-container clr-error">
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-error-1"
        name="toggle-error"
        value="option1"
        class="clr-toggle"
      />
      <label for="toggle-error-1" class="clr-control-label">option 1</label>
    </div>
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-error-2"
        name="toggle-error"
        value="option2"
        class="clr-toggle"
      />
      <label for="toggle-error-2" class="clr-control-label">option 2</label>
    </div>
    <div class="clr-toggle-wrapper">
      <input
        type="checkbox"
        id="toggle-error-3"
        name="toggle-error"
        value="option3"
        class="clr-toggle"
      />
      <label for="toggle-error-3" class="clr-control-label">option 3</label>
    </div>
    <div class="clr-subtext-wrapper">
      <span class="clr-subtext">Helper Text</span>
    </div>
    <div class="clr-subtext-wrapper error">
      <cds-icon class="clr-validate-icon" shape="error-standard" status="danger"></cds-icon>
      <span class="clr-subtext">Error message</span>
    </div>
  </div>
</div>
