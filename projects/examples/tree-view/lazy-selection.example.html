<clr-tree [clrLazy]="true">
  @for (group of groceries$ | async; track group.name) {
  <clr-tree-node [(clrSelected)]="group.selected">
    {{ group.name }}
    <ng-template clrIfExpanded>
      <clr-grocery-items [group]="group"></clr-grocery-items>
    </ng-template>
  </clr-tree-node>
  }
</clr-tree>
