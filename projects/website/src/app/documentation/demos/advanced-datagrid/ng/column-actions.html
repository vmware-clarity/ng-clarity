<div class="card card-block">
  <p class="card-text">Last pin change: {{ lastPinnedChange || 'none yet' }}</p>
  <p class="card-text">Last order change: {{ lastOrderChange || 'none yet' }}</p>
  <p class="card-text">Last action: {{ lastActionClick || 'none yet' }}</p>
</div>

<appfx-datagrid
  [gridItems]="vms"
  [columns]="columns"
  [selectedItems]="selectedVms"
  [selectionType]="SelectionType.Multi"
  [layoutModel]="{ stretchToParentHeight: false }"
  [footerModel]="{ showFooter: true }"
  [pageSize]="10"
  [enableColumnActions]="true"
  [columnActions]="columnActions"
  (selectedItemsChange)="onSelectedItemsChange($event)"
  (columnPinnedChange)="onColumnPinnedChange($event)"
  (columnOrderChange)="onColumnOrderChange($event)"
  (actionClick)="onActionClick($event)"
>
</appfx-datagrid>
