<div class="card card-block">
  <p class="card-text">Pinned columns: {{ pinnedColumns || 'none' }}</p>
  <p class="card-text">Last change: {{ lastPinnedChange || 'none yet' }}</p>
</div>

<!--
  enableColumnActions is what renders the menu that carries Pin Column, so a pinnable column needs it
  to give the user anything to work.
-->
<appfx-datagrid
  [gridItems]="vms"
  [columns]="columns"
  [selectedItems]="selectedVms"
  [selectionType]="SelectionType.Multi"
  [layoutModel]="{ stretchToParentHeight: false }"
  [footerModel]="{ showFooter: true }"
  [pageSize]="10"
  [enableColumnActions]="true"
  (selectedItemsChange)="onSelectedItemsChange($event)"
  (columnPinnedChange)="onColumnPinnedChange($event)"
>
</appfx-datagrid>
