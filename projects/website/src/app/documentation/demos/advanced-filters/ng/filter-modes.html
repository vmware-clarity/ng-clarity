<form clrForm>
  <clr-select-container>
    <label>Filter mode</label>
    <select clrSelect name="filter-mode" [(ngModel)]="filterMode">
      <option [ngValue]="FilterMode.Quick">Quick</option>
      <option [ngValue]="FilterMode.Advanced">Advanced</option>
      <option [ngValue]="FilterMode.AdvancedOnly">Advanced only</option>
      <option [ngValue]="FilterMode.Combined">Combined</option>
    </select>
  </clr-select-container>
</form>

<div cds-layout="m-t:md">
  <clr-advanced-filters
    [filterMode]="filterMode"
    [filterableProperties]="filterableProperties"
    (searchTermChange)="searchTerm = $event"
    (propertyFiltersChange)="filters = $event"
  ></clr-advanced-filters>
</div>

<app-applied-filters [filters]="filters" [searchTerm]="searchTerm" [showSearchTerm]="true"></app-applied-filters>
