<clr-advanced-filters
  [filterMode]="FilterMode.AdvancedOnly"
  [filterableProperties]="filterableProperties"
  [toggleFilters]="toggleFilters"
  [(propertyFilters)]="filters"
></clr-advanced-filters>

<div cds-layout="m-t:md">
  <button type="button" class="btn btn-sm btn-outline" (click)="restoreSavedView()">Restore saved view</button>
  <button type="button" class="btn btn-sm btn-link" (click)="clearFromHost()">Clear from host</button>
</div>

<app-applied-filters [filters]="filters"></app-applied-filters>
