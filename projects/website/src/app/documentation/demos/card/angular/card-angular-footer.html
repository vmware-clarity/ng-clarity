<div class="clr-example nomargin">
  <clr-card clrCardCollapsible [clrCardFooterCollapsible]="false" [(clrCardCollapsed)]="collapsed">
    <clr-card-header>Header</clr-card-header>
    <clr-card-body>
      <clr-card-body-title>Title</clr-card-body-title>
      <clr-card-body-text>The footer below stays visible even while this card is collapsed.</clr-card-body-text>
    </clr-card-body>
    <clr-card-footer>
      <button class="btn btn-sm btn-link">Action</button>
    </clr-card-footer>
  </clr-card>
</div>
<app-stackblitz-example
  name="angular card with fixed footer"
  [componentTemplate]="htmlExample"
></app-stackblitz-example>
