<h2 class="clr-mt-48px" cds-text="title">Custom cell rendering</h2>

<p class="clr-mt-16px clr-mb-16px" cds-text="body">
  Because we use a declarative API, simply projecting your HTML inside our components' templates, you have complete
  control over what we display. The contents of datagrid cells or column headers can be as complex as you need them to
  be, with nested components and interpolation.
</p>

<app-doc-example [example]="examples.customRendering"></app-doc-example>
