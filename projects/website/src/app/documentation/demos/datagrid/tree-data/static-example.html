<clr-datagrid [clrDgItemsIdentityFn]="identity">
  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>Role</clr-dg-column>

  <clr-dg-row
    *clrDgTreeItems="let item of people; getChildren: getChildren"
    [clrDgItem]="item"
    [clrDgExpandable]="!!item.reports?.length"
  >
    <clr-dg-cell>{{ item.name }}</clr-dg-cell>
    <clr-dg-cell>{{ item.role }}</clr-dg-cell>
  </clr-dg-row>
</clr-datagrid>
