<appfx-datagrid-filters
  [filterMode]="FilterMode.Combined"
  [filterableProperties]="filterableProperties"
  (searchTermChange)="onSearchTermChange($event)"
  (propertyFiltersChange)="onPropertyFiltersChange($event)"
></appfx-datagrid-filters>

<div cds-layout="m-t:md">
  <p cds-text="body medium">Loads</p>
  @if (loads().length) {
  <ul cds-list="unstyled" aria-live="polite">
    @for (load of loads(); track $index) {
    <li cds-text="body">{{ load }}</li>
    }
  </ul>
  } @else {
  <p cds-text="body">None yet. Search, add a filter, then use Clear all: it loads once.</p>
  }
</div>
