<div cds-layout="m-b:md">
  <button type="button" class="btn btn-sm btn-outline" (click)="showEqualsDay()">Equals a day</button>
  <button type="button" class="btn btn-sm btn-outline" (click)="showCustomRange()">Custom range</button>
  <button type="button" class="btn btn-sm btn-outline" (click)="showLastWeek()">Last week</button>
</div>

<appfx-datagrid-filters
  [filterMode]="FilterMode.AdvancedOnly"
  [filterableProperties]="filterableProperties"
  [predefinedFilters]="predefinedFilters"
  [(propertyFilters)]="filters"
></appfx-datagrid-filters>

<app-applied-filters [filters]="filters"></app-applied-filters>
