<div class="progbar-examples">
  <p class="clr-mt-24px" cds-text="body">
    Clarity also has a component <code cds-text="code">clrProgressBar</code>. That will add accessibility support for
    screen readers.
  </p>

  <h3 data-toc-item id="examples-demo" class="clr-mt-32px" cds-text="section">Examples</h3>

  <div class="clr-mt-32px">
    <app-doc-example [example]="examples.component"></app-doc-example>

    <br />

    <app-animated-example [label]="'looping progress bar'" [fullWidthContent]="true">
      <ng-container *ngComponentOutlet="examples.componentLoop.component"></ng-container>
    </app-animated-example>
    <app-doc-example [example]="examples.componentLoop" [showPreview]="false"></app-doc-example>

    <br />

    <app-doc-example [example]="examples.componentSuccess"></app-doc-example>

    <br />

    <app-doc-example [example]="examples.componentDisplayValue"></app-doc-example>

    <br />

    <app-doc-example previewClass="clr-mt-24px" [example]="examples.componentBlock"></app-doc-example>
  </div>
</div>
