<app-site-nav *ngIf="!themeBuilderOnly"></app-site-nav>

<main class="content-area theme-builder-page">
  <div>
    <h2 cds-text="title">Theme Builder</h2>
    <p cds-text="body" cds-layout="m-t:lg">
      Customize Clarity colors and export a CSS override file for your environment.
    </p>
    <div cds-layout="m-t:lg">
      <clr-alert [clrAlertType]="'info'" [clrAlertClosable]="false">
        <clr-alert-item>
          <span class="alert-text">
            Theme Builder only supports light mode for the outer shell. The theme toggle in header is disabled on this
            page.
          </span>
        </clr-alert-item>
      </clr-alert>
    </div>
  </div>

  <clr-theme-builder [presets]="presets" (generatedCSS)="writeGeneratedCss($event)" />

  <!-- ── Generated CSS card (full width below grid) ── -->
  <div class="card tb-output-card">
    <div class="card-header tb-output-header-row">
      <h2 cds-text="section">Generated CSS</h2>
      <div>
        <button class="btn btn-sm btn-outline" (click)="openSaveModal()">Save current preset</button>
        <button class="btn btn-sm btn-outline" (click)="openImportModal()">Import CSS</button>
        <button class="btn btn-sm btn-outline" (click)="copyCSS()">
          {{ copied ? 'Copied!' : 'Copy' }}
        </button>
      </div>
    </div>

    <app-code-snippet [code]="generatedCss" language="css"></app-code-snippet>
  </div>

  <app-site-footer></app-site-footer>
</main>

<clr-modal [(clrModalOpen)]="saveModalOpen">
  <div class="modal-title">Save current preset</div>
  <div class="modal-body">
    <div class="clr-form-control">
      <label for="preset-name-input" class="clr-control-label">Preset name</label>
      <div class="clr-control-container">
        <div class="clr-input-wrapper">
          <input id="preset-name-input" type="text" class="clr-input" required [(ngModel)]="presetNameInput" />
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="saveModalOpen = false">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="!presetNameInput.trim()" (click)="confirmSavePreset()">
      Save
    </button>
  </div>
</clr-modal>

<clr-modal [(clrModalOpen)]="importModalOpen">
  <div class="modal-title">Import generated CSS</div>
  <div class="modal-body">
    <div class="clr-form-control">
      <label for="css-import-input" class="clr-control-label">Paste previously generated CSS</label>
      <div class="clr-control-container">
        <textarea
          id="css-import-input"
          class="clr-textarea tb-import-textarea"
          rows="12"
          [(ngModel)]="cssToImportInput"
        ></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="importModalOpen = false">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="!cssToImportInput.trim()" (click)="confirmImportCss()">
      Import
    </button>
  </div>
</clr-modal>
