<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Clarity Design System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0065AB" />
    <meta
      name="Description"
      content="Clarity Design System. UX guidelines, HTML/CSS framework, and Angular components working together to craft exceptional experiences"
    />

    <base href="/" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JKD0PD2LJF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      if (/clarity.design/.test(window.location.href)) {
        function gtag() {
          dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-JKD0PD2LJF');
        window['trackIconSearch'] = function (searchedIcon, numberOfMatches) {
          gtag('send', 'event', 'icon-search', 'input', searchedIcon, numberOfMatches);
        };
      }
    </script>
  </head>

  <body id="body" cds-theme="light">
    <!-- The nonce Angular adds to the styles and scripts it injects. The visual regression test server
         (scripts/start-static-server.ts) serves the page with a Content-Security-Policy and replaces it per response.
         The production site sends no Content-Security-Policy, so the placeholder has no effect there. A host that adds
         one must replace the placeholder with a new nonce per response: a fixed nonce defeats the policy. -->
    <app-root ngCspNonce="CSP_NONCE"></app-root>
  </body>
</html>
